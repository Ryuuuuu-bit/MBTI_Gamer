<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>16 Gamer Heroes · คุณคือฮีโร่สายไหน?</title>
  <meta name="description" content="แบบทดสอบเกมเมอร์ 16 สาย ตอบ 20 ข้อ ปลดล็อกฮีโร่ chibi ประจำตัว (ชาย/หญิง) แชร์ลง IG Story ได้ทันที | 16 gamer heroes quiz with a shareable IG Story card.">
  <meta property="og:title" content="16 Gamer Heroes · คุณคือฮีโร่สายไหน?">
  <meta property="og:description" content="ตอบ 20 ข้อ ปลดล็อกฮีโร่ประจำตัวคุณจาก 16 สาย">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#07080f">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300..700&family=Chonburi&family=Cinzel:wght@500..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <canvas id="embers" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="hud">
    <a class="brand" href="./" id="homeLink"><span class="sigil"></span><span>16 GAMER HEROES</span></a>
    <div class="seg" role="group" aria-label="Language">
      <button data-lang="th">TH</button><button data-lang="en">EN</button>
    </div>
  </header>

  <main>
    <!-- ============ TITLE SCREEN ============ -->
    <section id="home" class="view">
      <div class="friend panel" id="friendBox" hidden></div>

      <div class="title-screen">
        <div class="title-art" id="heroArt"></div>
        <div class="title-text">
          <span class="ribbon" data-t="badge"></span>
          <h1 class="logo" data-th="heroTitle"></h1>
          <p class="lead" data-t="heroSub"></p>
          <div class="cta">
            <button class="btn-game xl" id="startBtn"><span data-t="start"></span></button>
            <a class="btn-ghost" href="#gallery" data-t="seeAll"></a>
          </div>
          <ul class="chips" id="heroChips"></ul>
        </div>
      </div>

      <section class="block" id="gallery">
        <div class="section-head">
          <h2 class="deco" data-t="galleryTitle"></h2>
          <div class="seg gender-seg" role="group" aria-label="Gender">
            <button data-gender="m" data-t="male"></button><button data-gender="f" data-t="female"></button>
          </div>
        </div>
        <p class="muted center" data-t="gallerySub"></p>
        <div class="factions" id="groups"></div>
      </section>

      <section class="block">
        <h2 class="deco" data-t="aboutTitle"></h2>
        <div class="about" id="about"></div>
        <p class="fine" data-t="notAffiliated"></p>
      </section>
    </section>

    <!-- ============ CHOOSE HERO ============ -->
    <section id="create" class="view" hidden>
      <div class="panel create">
        <h2 class="deco" data-t="createTitle"></h2>
        <p class="muted center" data-t="createSub"></p>
        <div class="gender-pick">
          <button class="pick" data-gender="m"><div class="pick-art" id="pickM"></div><b data-t="male"></b></button>
          <button class="pick" data-gender="f"><div class="pick-art" id="pickF"></div><b data-t="female"></b></button>
        </div>
        <div class="cta center">
          <button class="btn-game xl" id="goBtn"><span data-t="createGo"></span></button>
        </div>
        <button class="link" id="createBack" data-t="back"></button>
      </div>
    </section>

    <!-- ============ QUEST ============ -->
    <section id="quiz" class="view" hidden>
      <div class="quest-top">
        <button class="icon-btn" id="quitBtn" aria-label="Quit">✕</button>
        <div class="xp" aria-hidden="true"><span id="progressBar"></span></div>
        <span class="qcount" id="qCount"></span>
      </div>
      <div class="panel dialog" id="qCard">
        <div class="npc">
          <div class="npc-art" id="npcArt"></div>
          <span class="npc-name" data-t="guide"></span>
        </div>
        <h2 class="qtext" id="qText"></h2>
        <button class="choice a" id="stmtA"></button>
        <div class="scale" role="radiogroup" id="scale">
          <button class="gem a2" data-v="2"></button>
          <button class="gem a1" data-v="1"></button>
          <button class="gem b1" data-v="-1"></button>
          <button class="gem b2" data-v="-2"></button>
        </div>
        <button class="choice b" id="stmtB"></button>
        <p class="hint" data-t="pickHint"></p>
      </div>
      <button class="link" id="backBtn" data-t="back"></button>
    </section>

    <!-- ============ CLASS REVEAL ============ -->
    <section id="result" class="view" hidden>
      <div class="unlock" id="unlockBanner"><span data-t="unlocked"></span></div>

      <div class="reveal-grid">
        <article class="panel r-hero">
          <div class="altar">
            <div class="rune" aria-hidden="true"></div>
            <div class="tilt" id="rArt"></div>
          </div>
          <div class="r-id">
            <span class="eyebrow" data-t="youAre"></span>
            <div class="code" id="rCode"></div>
            <h1 class="r-name" id="rName"></h1>
            <p class="r-tag" id="rTag"></p>
            <div class="r-meta">
              <span class="faction" id="rGroup"></span>
              <div class="seg gender-seg small" role="group" aria-label="Gender">
                <button data-gender="m" data-t="male"></button><button data-gender="f" data-t="female"></button>
              </div>
            </div>
          </div>
        </article>

        <article class="panel r-stats">
          <h3 data-t="axesTitle"></h3>
          <div id="rAxes"></div>
          <p class="note" id="rBorderNote" hidden data-t="borderlineNote"></p>
        </article>

        <article class="panel r-card">
          <h3 data-t="storyCard"></h3>
          <img id="cardImg" class="story" alt="">
          <div class="actions">
            <button class="btn-game" id="shareBtn"><span data-t="share"></span></button>
            <button class="btn-ghost" id="saveBtn" data-t="save"></button>
            <button class="btn-ghost" id="copyBtn" data-t="copy"></button>
          </div>
          <p class="note" id="hint" hidden data-t="longPress"></p>
        </article>

        <article class="panel r-desc">
          <p class="desc" id="rDesc"></p>
          <h3 data-t="strengths"></h3>
          <ul class="skills" id="rStrengths"></ul>
          <h3 data-t="genres"></h3>
          <ul class="chips" id="rGenres"></ul>
        </article>

        <article class="panel r-duo">
          <h3 data-t="duo"></h3>
          <div class="duo-row" id="rDuo"></div>
          <p class="note" id="rTagFriend"></p>
        </article>

        <article class="panel r-gear" id="gearBox" hidden>
          <h3 data-t="gear"></h3>
          <ul id="gearList"></ul>
        </article>
      </div>
      <a class="sponsor" id="sponsorBox" hidden target="_blank" rel="sponsored noopener"></a>
      <div class="cta center">
        <button class="btn-game xl" id="retryBtn"><span data-t="retry"></span></button>
      </div>
      <p class="fine" data-t="notAffiliated"></p>
    </section>
  </main>

  <dialog id="typeDialog" class="panel">
    <button class="icon-btn close" id="dlgClose" aria-label="Close">✕</button>
    <div id="dlgBody"></div>
  </dialog>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
